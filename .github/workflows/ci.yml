name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Format, vet, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: check commit messages
        run: sh scripts/check-commit-message.sh --history 100

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      - name: build CLI
        run: go build -o bin/openiac ./cmd/openiac

      - name: build WebAssembly
        run: make wasm

      - name: verify playground artifacts
        run: test -s playground/main.wasm && test -s playground/wasm_exec.js

      - name: convert example
        run: ./bin/openiac convert ./examples/aws-web-app --target both --stdout > /dev/null
